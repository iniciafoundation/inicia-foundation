name: diag-sheet
on: { push: { branches: [diag-sheet] } }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: |
          set +e
          for i in $(seq 1 10); do JS=$(curl -s https://iniciafoundation.org/contacto | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1); C=$(curl -s "https://iniciafoundation.org$JS" | grep -c 'features'); P=$(curl -s https://iniciafoundation.org/privacidad | grep -c 'IBAN'); [ "$P" -gt 0 ] && break; sleep 60; done
          echo "::notice title=live::js=$JS features=$C privacy_iban=$P"
