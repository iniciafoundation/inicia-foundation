name: diag-sheet
on: { push: { branches: [diag-sheet] } }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: |
          set +e
          for i in $(seq 1 10); do H=$(curl -s https://iniciafoundation.org/ | grep -c 'empiezan de nuevo'); M=$(curl -s https://iniciafoundation.org/mision | grep -c 'Seis líneas de trabajo'); [ "$H" -gt 0 ] && [ "$M" -gt 0 ] && break; sleep 60; done
          echo "::notice title=live::home=$H mision=$M"
