name: diag-sheet
on: { push: { branches: [diag-sheet] } }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set +e
          U=https://docs.google.com/forms/d/1YTfQ4ef8wIZuIFYvn6zpe4f6GgB8qeOcN0AhfqgYbN8/viewform
          R=$(curl -sL -o page.html -w "%{http_code} %{url_effective}" "$U")
          T=$(grep -o '<title>[^<]*' page.html | head -1); A=$(grep -c 'accepting responses\|ya no acepta' page.html); L=$(grep -c 'ServiceLogin\|accounts.google.com' page.html)
          echo "::notice title=form::$R | $T | closed=$A | login=$L"
