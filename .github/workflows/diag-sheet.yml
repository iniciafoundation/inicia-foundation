name: diag-sheet
on: { push: { branches: [diag-sheet] } }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          for i in 1 2 3 4 5 6; do c=$(curl -s https://iniciafoundation.org/mision | grep -c "Pasa a la acci"); [ "$c" -gt 0 ] && break; sleep 60; done
          echo "::notice title=live::CTA on /mision: $c; bar=$(curl -s https://iniciafoundation.org/ | grep -c 'Colaborar</a>'); hero=$(curl -sI https://iniciafoundation.org/assets/photos/vision-960.webp | grep -i content-length)"
