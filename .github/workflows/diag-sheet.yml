name: diag-sheet
on: { push: { branches: [diag-sheet] } }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - run: |
          set +e
          for i in $(seq 1 10); do P=$(curl -s https://iniciafoundation.org/proyectos/reutiliza-y-forma | grep -c 'gijon-juventud'); [ "$P" -gt 0 ] && break; sleep 60; done
          L=$(curl -s -o /dev/null -w "%{http_code}" https://iniciafoundation.org/assets/partners/gijon-juventud-480.webp)
          echo "::notice title=live::page_logo=$P logo_http=$L"
