name: diag-sheet
on: { push: { branches: [diag-sheet] } }
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Lighthouse production (median of 3)
        run: |
          set +e
          npm i -g lighthouse@12.6.1 >/dev/null 2>&1
          S=${SITE:-https://iniciafoundation.org}
          for u in "" donar contacto proyectos mision noticias; do
            for k in 1 2 3; do lighthouse "$S/$u" --quiet --chrome-flags="--headless=new --no-sandbox" --only-categories=performance --output=json --output-path=r-$k.json >/dev/null 2>&1; done
            node -e "const rs=[1,2,3].map(k=>{try{return require('./r-'+k+'.json')}catch{return null}}).filter(Boolean).sort((a,b)=>a.categories.performance.score-b.categories.performance.score);const r=rs[Math.floor(rs.length/2)];const a=r.audits;console.log('/$u','perf',Math.round(r.categories.performance.score*100),'('+rs.map(x=>Math.round(x.categories.performance.score*100)).join('/')+')','FCP',a['first-contentful-paint'].displayValue,'LCP',a['largest-contentful-paint'].displayValue,'TBT',a['total-blocking-time'].displayValue,'CLS',a['cumulative-layout-shift'].displayValue,'SI',a['speed-index'].displayValue); if('$u'==='') for (const k of ['bootup-time','mainthread-work-breakdown','unused-javascript','lcp-breakdown-insight','render-blocking-insight','network-dependency-tree-insight']) { const v=a[k]; if(v) console.log('  ',k,v.displayValue||'', JSON.stringify((Array.isArray(v.details?.items)?v.details.items:[]).slice(0,4).map(i=>[i.url||i.groupLabel||i.label||'',Math.round(i.total||i.duration||i.wastedBytes||0)])).slice(0,300)); }" >> out.txt 2>&1
          done
          python3 - <<'PY'
          t=open('out.txt',errors='replace').read()
          for i in range(0,len(t),3800):
              print("::notice title=p%d::%s" % (i//3800, t[i:i+3800].replace('%','%25').replace('\r','').replace('\n','%0A')))
          PY
