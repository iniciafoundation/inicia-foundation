name: diag-forms
on: { push: { branches: [diag-forms-2026-10-26] } }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: What blocks first paint on the preview
        run: |
          exec > >(tee -a out.txt) 2>&1
          U=https://deploy-preview-4--iniciafoundation.netlify.app/alianzas
          curl -sI --compressed $U | grep -iE "content-encoding|cache-control|x-robots|content-length|server"
          curl -s --compressed $U -o page.html; wc -c page.html
          grep -oE '<(script|link)[^>]*>' page.html | grep -vE 'preload" as="image' | head -20
          npm i -g lighthouse@13 >/dev/null 2>&1
          lighthouse $U --quiet --chrome-flags="--headless=new --no-sandbox" --only-categories=performance --output=json --output-path=lh.json >/dev/null 2>&1
          node -e "const a=require('./lh.json').audits;for(const k of ['render-blocking-insight','network-dependency-tree-insight','lcp-breakdown-insight']){console.log('##',k,JSON.stringify(a[k]?.details).slice(0,1500))};const n=a['network-requests'].details.items.map(i=>[Math.round(i.networkRequestTime),Math.round(i.networkEndTime),Math.round(i.transferSize/1024)+'KB',i.url.slice(0,90)].join(' '));console.log(n.join('\n'))"
      - name: Publish output
        if: always()
        run: |
          python3 - <<'PY'
          t=open('out.txt',errors='replace').read()
          for i in range(0,len(t),3500):
              chunk=t[i:i+3500].replace('%','%25').replace('\r','').replace('\n','%0A')
              print(f"::notice title=part{i//3500}::{chunk}")
          PY
