[build]
  command = "pnpm exec vite build && node scripts/prerender.mjs"
  publish = "dist/public"
  functions = "netlify/functions"

[build.environment]
  VITE_DEPLOY_TARGET = "netlify"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "pnpm exec vite --host 0.0.0.0"
  publish = "dist/public"

# Preserve established public paths before the SPA fallback.
[[redirects]]
  from = "/galeria"
  to = "/alianzas"
  status = 301
  force = true

[[redirects]]
  from = "/quienes-somos"
  to = "/#quienes-somos"
  status = 308
  force = true

[[redirects]]
  from = "/proyectos/coopastur"
  to = "/proyectos/coopastur-agrosocial"
  status = 308
  force = true

[[redirects]]
  from = "/presentation/conecta.html"
  to = "/proyectos/conecta-asturias"
  status = 308
  force = true

[[redirects]]
  from = "/presentation/coopastur.html"
  to = "/proyectos/coopastur-agrosocial"
  status = 308
  force = true

[[redirects]]
  from = "/presentation/nucleo.html"
  to = "/proyectos/reutiliza-y-forma"
  status = 308
  force = true

[[redirects]]
  from = "/index_congreso.html"
  to = "/proyectos"
  status = 410
  force = true

[[redirects]]
  from = "/presentation/index.html"
  to = "/proyectos"
  status = 410
  force = true

[[redirects]]
  from = "/presentation/index copia.html"
  to = "/proyectos"
  status = 410
  force = true

[[redirects]]
  from = "/presentation/index%20copia.html"
  to = "/proyectos"
  status = 410
  force = true

# Public pages are prerendered to their own index.html (scripts/prerender.mjs) and
# are served directly. Anything else (login, admin, unknown URLs) gets the app shell.
[[redirects]]
  from = "/*"
  to = "/spa.html"
  status = 200

# Hashed JS/CSS and images: let browsers keep them; HTML always revalidates.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Variant 2 scaffold only. Runtime secrets must be set in a separate Netlify
# project's Functions environment; never put values in this file.
